version: '1.0'
name: pipeline-20260608
displayName: KovaTauriBuild
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - dev
stages:
  - name: stage-bb40c76e
    displayName: Build
    strategy: naturally
    trigger: auto
    executor:
      - ynx520
    steps:
      - step: build@nodejs
        name: build_kova
        displayName: Build Kova
        nodeVersion: 22.22.0
        commands:
          - node -v
          - npm -v
          - npm ci
          - npm run lint
          - npm run build
          - ''
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./src-tauri/target/release/bundle
        caches:
          - node_modules
          - ~/.npm
          - ~/.cargo/registry
          - ~/.cargo/git
          - src-tauri/target
        notify: []
        strategy:
          retry: '0'
