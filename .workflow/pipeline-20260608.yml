version: '1.0'
name: pipeline-20260608
displayName: Kova Tauri Build
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - dev
stages:
  - name: stage-bb40c76e
    displayName: Build
    strategy: naturally
    trigger: auto
    executor:
      - ynx520
    steps:
      - step: build@nodejs
        name: build_kova
        displayName: Build Kova
        nodeVersion: '20.17.0'
        commands:
          - node -v
          - npm -v
          - npm ci
          - npm run lint
          - npm run build
          - |
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            fi
          - export PATH="$HOME/.cargo/bin:$PATH"
          - rustup toolchain install 1.89.0 --profile minimal
          - rustup default 1.89.0
          - rustc --version
          - cargo --version
          - |
            if command -v sudo >/dev/null 2>&1; then
              SUDO=sudo
            else
              SUDO=
            fi

            if command -v apt-get >/dev/null 2>&1; then
              $SUDO apt-get update
              $SUDO apt-get install -y --no-install-recommends \
                build-essential \
                curl \
                file \
                libgtk-3-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                patchelf \
                pkg-config
              $SUDO apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev || \
              $SUDO apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
            elif command -v yum >/dev/null 2>&1; then
              $SUDO yum install -y \
                gcc \
                gcc-c++ \
                make \
                curl \
                file \
                gtk3-devel \
                librsvg2-devel \
                openssl-devel \
                patchelf \
                pkgconfig \
                webkit2gtk3-devel || true
            fi
          - export PATH="$HOME/.cargo/bin:$PATH" && npx tauri build
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./src-tauri/target/release/bundle
        caches:
          - node_modules
          - ~/.npm
          - ~/.cargo/registry
          - ~/.cargo/git
          - src-tauri/target
        notify: []
        strategy:
          retry: '0'
