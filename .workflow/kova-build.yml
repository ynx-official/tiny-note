name: kova-build
displayName: 'Kova Linux 构建'
triggers:
  push:
    - matchType: PRECISE
      branch: master
    - matchType: PRECISE
      branch: main
    - matchType: PRECISE
      branch: develop
  pullRequest:
    - matchType: WILDCARD
      branch: '*'
commitMessage: ''
stages:
  - stage:
      name: build-stage
      displayName: '检查与打包'
      failFast: true
      steps:
        - step: npmbuild@1
          name: frontend-check
          displayName: '前端检查'
          inputs:
            nodeVersion: 20.17
            goals: |
              node -v
              npm -v
              npm ci
              npm run lint
              npm run build

        - step: npmbuild@1
          name: tauri-linux-build
          displayName: 'Tauri Linux 打包'
          dependsOn: frontend-check
          inputs:
            nodeVersion: 20.17
            goals: |
              set -e
              node -v
              npm -v
              npm ci

              if ! command -v rustup >/dev/null 2>&1; then
                curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              fi
              export PATH="$HOME/.cargo/bin:$PATH"
              rustup default stable
              rustup target add x86_64-unknown-linux-gnu
              rustc --version
              cargo --version

              if command -v sudo >/dev/null 2>&1; then
                SUDO=sudo
              else
                SUDO=
              fi

              if command -v apt-get >/dev/null 2>&1; then
                $SUDO apt-get update
                $SUDO apt-get install -y --no-install-recommends \
                  build-essential \
                  curl \
                  file \
                  libgtk-3-dev \
                  libayatana-appindicator3-dev \
                  librsvg2-dev \
                  patchelf \
                  pkg-config
                $SUDO apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev || \
                $SUDO apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
              elif command -v yum >/dev/null 2>&1; then
                $SUDO yum install -y \
                  gcc \
                  gcc-c++ \
                  make \
                  curl \
                  file \
                  gtk3-devel \
                  librsvg2-devel \
                  openssl-devel \
                  patchelf \
                  pkgconfig \
                  webkit2gtk3-devel || true
              fi

              npx tauri build
            uploadArtifact: true
            uploadArtifactOptions:
              artifactPath: './src-tauri/target/release/bundle'
              artifactRepository: 'gitee-go'
              artifactName: 'kova-linux-bundle'
