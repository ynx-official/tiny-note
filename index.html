<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Tiny Note</title>
    <script>(()=>{let theme='system';try{theme=localStorage.getItem('tiny-note-theme-setting')||localStorage.getItem('tiny-note-theme')||'system'}catch{}document.documentElement.dataset.theme=theme==='dark'||theme==='light'?theme:window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'})()</script>
    <link rel="stylesheet" href="/boot.css" />
  </head>
  <body>
    <div id="app"><div class="boot-shell" aria-label="Tiny Note 正在启动"><div class="boot-topbar"><span>Tiny Note</span></div><div class="boot-body"><div class="boot-rail" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="boot-surface"><span class="boot-status" role="status">正在打开工作区…</span></div></div></div></div>
    <script>window.__TINY_NOTE_BOOT_TIMINGS__={...(window.__TINY_NOTE_BOOT_TIMINGS__||{}),'static-shell':performance.now()};performance.mark('tiny-note:static-shell');window.__TAURI_INTERNALS__?.invoke('startup_probe',{state:'static-shell',browserTimestamp:performance.timeOrigin+performance.now()}).catch(()=>{})</script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
