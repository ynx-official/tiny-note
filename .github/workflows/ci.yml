name: Tiny Note CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tiny-note-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          webkit_package=libwebkit2gtk-4.1-dev
          if ! apt-cache show "$webkit_package" >/dev/null 2>&1; then
            webkit_package=libwebkit2gtk-4.0-dev
          fi
          sudo apt-get install -y \
            "$webkit_package" \
            libglib2.0-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: stable }
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  windows-bundle:
    needs: checks
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Enable pnpm for tauri-action
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: tiny-note-v__VERSION__
          releaseName: Tiny Note v__VERSION__
          releaseDraft: true
          prerelease: true

  macos-bundle:
    needs: checks
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            args: --target x86_64-apple-darwin
          - runner: macos-14
            args: --target aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Enable pnpm for tauri-action
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: tiny-note-v__VERSION__
          releaseName: Tiny Note v__VERSION__
          releaseDraft: true
          prerelease: true
