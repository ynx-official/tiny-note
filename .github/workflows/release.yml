name: Release Tiny Note

on:
  push:
    tags:
      - tiny-note-v*

permissions:
  contents: write

concurrency:
  group: tiny-note-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      release_body: ${{ steps.release-notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs --tag "$GITHUB_REF_NAME"
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/tiny-note-v')
        id: release-notes
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/tiny-note-release-notes.md"
          node scripts/release-notes.mjs --tag "$GITHUB_REF_NAME" --output "$NOTES_FILE"
          {
            echo 'body<<EOF'
            cat "$NOTES_FILE"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage,deb
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - runner: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build and publish tagged release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: tiny-note-v__VERSION__
          releaseName: Tiny Note v__VERSION__
          releaseBody: ${{ needs.preflight.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true

  publish-manifest:
    needs: release
    if: startsWith(github.ref, 'refs/tags/tiny-note-v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generate and upload update manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run release:manifest
