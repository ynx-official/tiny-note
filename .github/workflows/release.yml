name: Release Tiny Note

on:
  push:
    tags:
      - tiny-note-v*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiny-note-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    env:
      UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
        if: github.event_name == 'push'
      - name: Validate project versions for manual releases
        run: node scripts/check-release-version.mjs
        if: github.event_name == 'workflow_dispatch'
      - name: Require updater signing keys
        shell: bash
        run: |
          test -n "$UPDATER_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          test -n "$UPDATER_PUBLIC_KEY" || { echo "Missing TAURI_UPDATER_PUBKEY"; exit 1; }

  release:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage,deb
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - runner: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CONFIG: >-
            {"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"${{ secrets.TAURI_UPDATER_PUBKEY }}","endpoints":["https://github.com/ynx-official/tiny-note/releases/latest/download/latest.json"],"windows":{"installMode":"passive"}}}}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: tiny-note-v__VERSION__
          releaseName: Tiny Note v__VERSION__
          releaseBody: Signed installers for Windows, macOS, and Linux. The generated latest.json powers in-app updates.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
