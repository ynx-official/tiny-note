[package]
name = "tiny-note"
version = "0.1.10"
description = "Tiny Note local-first notes and knowledge base"
authors = ["Tiny Note"]
edition = "2021"

[lib]
name = "tiny_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2"
walkdir = "2"
trash = "5"
sha2 = "0.10"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls", "multipart"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
rhai = { version = "1", default-features = false, features = ["serde", "sync"] }
pulldown-cmark = "0.13.4"
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
